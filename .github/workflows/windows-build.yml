# DataViewer-Desktop — Windows 构建 + 冒烟（D7 已定 GitHub Actions windows-latest）
#
# 上游源码获取：内网 CodeHub 对 runner 不可达，dev box 用
# scripts/make-source-bundle.sh 打包源码 tar 后 `gh release create <版本>-src`
# 上传到本仓 release；本 workflow 用 gh CLI（GITHUB_TOKEN 自动注入）下载。
# 后续可评估 GitHub mirror 方案。

name: windows-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v4.10.1-d1）；源码包需已上传到 <版本>-src release"
        required: true
        default: "v4.10.1-d1"

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout 本仓（拿脚本）
        uses: actions/checkout@v4

      - name: 下载源码包（<版本>-src release asset）
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.version }}-src" --pattern "source-*.tar.gz" --output source.tar.gz
          New-Item -ItemType Directory -Force upstream | Out-Null
          tar -xzf source.tar.gz -C upstream

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node 20（runner 默认 node 的 npm 有 Exit handler 环境故障）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        run: pip install uv

      - name: 后端依赖（Windows venv + uv lock 对齐）
        shell: pwsh
        run: |
          Push-Location upstream/backend
          uv lock
          # 默认只装 base 依赖（ray/hf 等 optional extras 不装 = 桌面依赖集）
          uv sync
          Pop-Location

      - name: 后端 pytest（全量收集 + 平台敏感子集；配额控制，全量跑 windows-pytest-full）
        shell: pwsh
        run: |
          Push-Location upstream/backend
          $env:DATA_ROOT = "D:\dv-ci-data"
          $env:METADATA_DIR = "D:\dv-ci-meta"
          New-Item -ItemType Directory -Force $env:DATA_ROOT, $env:METADATA_DIR | Out-Null
          # 1) 全量收集 = 依赖闭包 + import 链验证（2-3 分钟）
          uv run --project . --with pytest python -m pytest tests/ --collect-only -q
          # 2) 平台敏感子集真跑（路径/锁/换行/能力开关，几分钟内完成）
          uv run --project . --with pytest python -m pytest `
            tests/test_windows_file_semantics.py tests/test_files_safe_path.py `
            tests/test_config_secrets.py tests/test_system_monitor_windows.py `
            tests/test_writeback_service.py tests/test_protected_field.py `
            tests/test_aggregation_core.py tests/test_pangu_to_atif.py `
            tests/test_folder_visibility_middleware.py `
            tests/test_capabilities_api.py tests/test_capability_gates.py `
            -q --tb=short
          Pop-Location

      - name: 前端构建 + 组装绿色包
        shell: pwsh
        run: |
          .\scripts\build-win.ps1 -SourceDir upstream -Version "${{ inputs.version }}" -OutputDir "build\${{ inputs.version }}"

      - name: 冒烟（起服 → health → capabilities → 静态页）
        shell: pwsh
        run: |
          Push-Location "build\${{ inputs.version }}\backend"
          $env:DATA_ROOT = "D:\dv-ci-data"
          $env:METADATA_DIR = "D:\dv-ci-meta"
          # 冒烟步骤内显式建目录（不依赖 pytest 步骤的同 runner 状态），
          # 对应 start.bat 的 mkdir DATA_ROOT —— 磁盘余量端点需其存在
          New-Item -ItemType Directory -Force $env:DATA_ROOT, $env:METADATA_DIR | Out-Null
          $env:JWT_SECRET_KEY = "ci-smoke-secret"
          $env:ADMIN_PASSWORD = "ci-smoke-password"
          $env:GATEWAY_PUSH_ENABLED = "false"; $env:DATALAB_ENABLED = "false"
          $env:HF_ENABLED = "false"; $env:ARENA_ENABLED = "false"
          $env:CLAUDE_ENABLED = "false"; $env:S3_ENABLED = "false"
          $env:VOLCENGINE_ENABLED = "false"; $env:SCP_ENABLED = "false"
          $env:QUALITY_RAY_ENABLED = "false"; $env:TRAJ_VIZ_ENABLED = "false"
          $env:WORKBENCH_ENABLED = "false"
          # Windows 控制台默认 cp1252，源码有 Unicode 顶层 print（如 pilot.py ✓）会崩
          $env:PYTHONUTF8 = "1"
          # 诊断：起服前先验证 import 链（崩溃点直接进 runner 日志）
          & "..\python\python.exe" -c "import main; print('IMPORT_OK')"
          if ($LASTEXITCODE -ne 0) { throw "import main 失败: $LASTEXITCODE" }
          # launcher 打包完整性（M3）：pystray/Pillow 已入 embeddable，launcher.py 就位且可编译
          # （embeddable 无 tkinter，launcher 错误弹窗走 ctypes MessageBoxW，无需 tkinter）
          & "..\python\python.exe" -c "import pystray, PIL, py_compile; py_compile.compile(r'..\launcher\launcher.py', doraise=True); print('LAUNCHER_OK')"
          if ($LASTEXITCODE -ne 0) { throw "launcher 打包不完整: $LASTEXITCODE" }
          # embeddable Python 的 python.exe 在 python/ 根目录（自包含，不依赖 runner 路径）
          $proc = Start-Process -FilePath "..\python\python.exe" `
            -ArgumentList "-m","uvicorn","main:app","--port","8888" `
            -RedirectStandardOutput "uvicorn.out" -RedirectStandardError "uvicorn.err" `
            -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 120; $i++) {
              try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:8888/api/health" -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ok) {
              Write-Host "=== uvicorn.err ==="
              Get-Content uvicorn.err -ErrorAction SilentlyContinue
              Write-Host "=== uvicorn.out ==="
              Get-Content uvicorn.out -ErrorAction SilentlyContinue
              throw "health 超时"
            }
            $caps = (Invoke-WebRequest -Uri "http://127.0.0.1:8888/api/capabilities").Content | ConvertFrom-Json
            $off = @("gateway","datalab","hf","arena","claude","s3","volcengine","scp","ray_quality","traj_viz","workbench")
            foreach ($k in $off) { if ($caps.$k) { throw "capability 应为 false: $k" } }
            $idx = Invoke-WebRequest -Uri "http://127.0.0.1:8888/" -TimeoutSec 5
            if ($idx.StatusCode -ne 200 -or $idx.Content -notmatch "DataViewer") { throw "静态首页异常" }
            # 前端 dist 完整：从 index.html 抽一个 JS chunk 并请求 200
            $asset = [regex]::Match($idx.Content, 'src="([^"]+\.js)"').Groups[1].Value
            if (-not $asset) { throw "index.html 无 JS chunk 引用" }
            $a = Invoke-WebRequest -Uri ("http://127.0.0.1:8888" + $asset) -TimeoutSec 5
            if ($a.StatusCode -ne 200) { throw "JS chunk 不可达: $asset" }
            # 鉴权中间件生效：未带 token 的核心 API 应 401（不是 500/200）
            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:8888/api/files/list" -TimeoutSec 5 | Out-Null
              throw "未鉴权 /api/files/list 应被拒"
            } catch {
              if ($_.Exception.Response.StatusCode -ne 401) { throw "预期 401，实际: $($_.Exception.Response.StatusCode)" }
            }
            # 根静态 favicon（补丁 0018 白名单）应 200：单进程部署由 StaticFiles
            # 直出，线上由 nginx 前置、不走此中间件——真机冒烟曾 401
            $fav = Invoke-WebRequest -Uri "http://127.0.0.1:8888/dataviewer-logo.svg" -TimeoutSec 5
            if ($fav.StatusCode -ne 200) { throw "favicon 异常: $($fav.StatusCode)" }
            # 初始化 admin + 带 token 请求磁盘余量（真机曾因 DATA_ROOT 未建 500）
            $body = @{ username="ciadmin"; password="ci-smoke-password"; display_name="CI Admin"; email_prefix="ciadmin" } | ConvertTo-Json
            $setup = Invoke-WebRequest -Uri "http://127.0.0.1:8888/api/auth/setup" -Method Post -ContentType "application/json" -Body $body -TimeoutSec 10
            $tok = ($setup.Content | ConvertFrom-Json).access_token
            if (-not $tok) { throw "setup 未返回 access_token" }
            $disk = Invoke-WebRequest -Uri "http://127.0.0.1:8888/api/system/disk-space" -Headers @{ Authorization = "Bearer $tok" } -TimeoutSec 5
            if ($disk.StatusCode -ne 200) { throw "disk-space 异常: $($disk.StatusCode)" }
            # 多根盘符浏览（D16/补丁 0019）：/api/files/root（带 token）应列出 data 根 + Windows 盘符
            $rootInfo = (Invoke-WebRequest -Uri "http://127.0.0.1:8888/api/files/root" -Headers @{ Authorization = "Bearer $tok" }).Content | ConvertFrom-Json
            $rootKeys = @($rootInfo.available.PSObject.Properties.Name)
            if ($rootKeys -notcontains "data") { throw "files/root 缺 data 根: $($rootKeys -join ',')" }
            if ($rootKeys -notcontains "C:") { throw "files/root 缺盘符根 C:: $($rootKeys -join ',')" }
            Write-Host "[smoke] OK: health + capabilities(11 off) + 静态页 + JS chunk + 鉴权 401 + favicon + setup登录 + disk-space + 多根(data+C:)"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
          Pop-Location

      - name: 上传产物（绿色包 zip）
        uses: actions/upload-artifact@v4
        with:
          name: DataViewer-Desktop-${{ inputs.version }}-win64
          path: build/${{ inputs.version }}.zip

      - name: 编译安装器（Inno Setup 6）
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Invoke-WebRequest "https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe" -OutFile "$env:TEMP\innosetup.exe"
            Start-Process "$env:TEMP\innosetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe 未找到: $iscc" }
          $version = "${{ inputs.version }}"
          $appVersion = $version.TrimStart('v')
          $buildDir = (Resolve-Path "build\$version").Path
          & $iscc "/dBuildDir=$buildDir" "/dAppVersion=$appVersion" "installer\dataviewer-desktop.iss"
          if ($LASTEXITCODE -ne 0) { throw "iscc 编译失败: $LASTEXITCODE" }
          Get-ChildItem installer\Output\*.exe | ForEach-Object { Write-Host "安装器产物: $($_.FullName)" }

      - name: 上传安装器（exe）
        uses: actions/upload-artifact@v4
        with:
          name: DataViewerDesktopSetup-${{ inputs.version }}
          path: installer/Output/*.exe
          if-no-files-found: error
